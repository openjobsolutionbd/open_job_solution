name: current-affairs চেক (build + verify + সংঘর্ষ)

# ২০২৬-০৯ subtree migration-এর পর current-affairs/.github/workflows/-এর ফাইল
# GitHub Actions আর পড়ে না (শুধু repo-রুটের .github/workflows/ পড়া হয়) — তাই এই
# workflow সেই জায়গায় root-এ বসানো হলো। এটা আগের update-wiki.yml-এর মতো main-এ
# সরাসরি push করে না (main branch-protection সেটা ব্লক করবে); বরং pr-check.yml-এর
# ধাঁচে PR-টাইমেই সব যাচাই করে।
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "current-affairs/**"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: current-affairs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python সেটআপ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: dependencies ইনস্টল
        run: pip install pyyaml

      - name: Node সেটআপ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: current-affairs/package-lock.json

      - name: npm dependencies ইনস্টল
        run: npm ci

      - name: generated ফাইল guard + অন্য PR-এর সাথে সংঘর্ষ চেক
        id: prechecks
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python3 scripts/pr_checks.py

      - name: কনটেন্ট বিল্ড ভ্যালিডেশন
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/build_index.py 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: build সতর্কতা → PR-কমেন্ট (ব্যর্থ করে না)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python3 scripts/pr_build_warnings.py "$RUNNER_TEMP/build.log"

      - name: build আউটপুট বাসি (stale) কিনা — commit করা generated ফাইলের সাথে diff
        id: freshness
        continue-on-error: true
        if: steps.build.outcome == 'success'
        run: |
          if ! git diff --quiet -- docs/topics-index.json docs/ghotonaprobaho-index.json docs/top-news-index.json docs/mcq-index.json docs/sitemap.xml docs/topic/; then
            echo "নিচের generated ফাইল বাসি — লোকালি 'python3 scripts/build_index.py' চালিয়ে diff commit করুন:"
            git diff --stat -- docs/topics-index.json docs/ghotonaprobaho-index.json docs/top-news-index.json docs/mcq-index.json docs/sitemap.xml docs/topic/
            exit 1
          fi

      - name: সাইট-জুড়ে ভেরিফাই
        id: verify
        continue-on-error: true
        if: steps.build.outcome == 'success'
        run: python3 scripts/verify_site.py

      - name: sync/cache-scope/domain রিগ্রেশন-গার্ড
        id: integration_guard
        continue-on-error: true
        if: steps.build.outcome == 'success'
        run: python3 scripts/verify_integration_bugs.py

      - name: JS regression suite (jsdom)
        id: js_tests
        continue-on-error: true
        run: npm run test:js

      - name: build_index.py regression suite
        id: py_build_tests
        continue-on-error: true
        run: python3 scripts/test_build_index.py

      - name: pr_checks.py regression suite
        id: py_pr_tests
        continue-on-error: true
        run: python3 scripts/test_pr_checks.py

      - name: চূড়ান্ত ফলাফল
        if: steps.prechecks.outcome != 'success' || steps.build.outcome != 'success' || steps.freshness.outcome != 'success' || steps.verify.outcome != 'success' || steps.integration_guard.outcome != 'success' || steps.js_tests.outcome != 'success' || steps.py_build_tests.outcome != 'success' || steps.py_pr_tests.outcome != 'success'
        run: |
          echo "এক বা একাধিক চেক ব্যর্থ হয়েছে — উপরের ধাপ বা PR-কমেন্টে বিস্তারিত দেখুন।"
          exit 1
