name: Current Affairs Docs Staleness Check (scheduled)

# উদ্দেশ্য: current-affairs/AGENTS.md, EDITORIAL_MEMORY.md ও PR_GUIDE.md-এ
# migration/rename/rewrite-এর পর পুরনো/ভাঙা রেফারেন্স, নিজেই-stale-হয়ে-যাওয়া
# হাতে-লেখা স্ন্যাপশট, undocumented script, বা অতিরিক্ত আকার — এগুলো কারো
# ম্যানুয়াল অডিট সেশন ছাড়াই স্বয়ংক্রিয়ভাবে ধরা।
#
# current-affairs-health-check.yml-এর সাথে পার্থক্য: ওটা docs/ (generated
# build output)-এর রিগ্রেশন ধরে, এটা AGENTS.md/EDITORIAL_MEMORY.md/PR_GUIDE.md
# (এজেন্ট-নির্দেশনা প্রোজ) নিজেই বাস্তবতা থেকে সরে গেছে কিনা ধরে।
#
# এই workflow নিজে থেকে prose মুছে/ঠিক করে না, শুধু GitHub Issue বানিয়ে
# জানায় — এডিটোরিয়াল সিদ্ধান্ত ভুলবশত হারানোর ঝুঁকি এড়াতে (ফিক্স একজন
# সেশনে রিভিউ করে করতে হবে)।

on:
  schedule:
    # সপ্তাহে একবার, সোমবার বাংলাদেশ সময় সকাল ৯টায় (UTC ০৩:০০) —
    # docs-drift health-check-এর মতো প্রতিদিন বদলায় না, তাই কম ঘনঘন যথেষ্ট
    - cron: "0 3 * * 1"
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - "current-affairs/AGENTS.md"
      - "current-affairs/EDITORIAL_MEMORY.md"
      - "current-affairs/PR_GUIDE.md"
      - "_dev/scripts/doc_staleness_check.py"

permissions:
  contents: read
  issues: write
  # pull_request-এ রিপোর্ট কমেন্ট করতে লাগে — না থাকলে createComment
  # "Resource not accessible by integration" দিয়ে ব্যর্থ হয়ে চেকটা লাল হয়ে যায়
  # (pr-check.yml-ও একই কারণে দুটোই রাখে)।
  pull-requests: write

jobs:
  doc-staleness-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: স্টেলনেস-পরীক্ষা চালানো (advisory — এই ধাপ কখনো PR ব্লক করে না)
        id: check
        continue-on-error: true
        run: python3 _dev/scripts/doc_staleness_check.py

      - name: pull_request-এ পাওয়া গেলে সরাসরি কমেন্ট করা
        if: github.event_name == 'pull_request' && steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/doc_staleness_report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report,
            });

      - name: schedule-এ সমস্যা পেলে GitHub Issue বানানো/আপডেট করা
        if: github.event_name != 'pull_request' && steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/doc_staleness_report.md', 'utf8');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'current-affairs-docs-staleness',
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `আজও (${new Date().toISOString().slice(0,10)}) একই ধরনের সমস্যা পাওয়া গেছে:\n\n${report}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🧹 current-affairs docs-staleness — ${new Date().toISOString().slice(0,10)}`,
                body: report,
                labels: ['current-affairs-docs-staleness'],
              });
            }

      - name: schedule-এ সমস্যা না পেলে পুরনো Issue বন্ধ করা
        if: github.event_name != 'pull_request' && steps.check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'current-affairs-docs-staleness',
            });
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'পরবর্তী স্বয়ংক্রিয় পরীক্ষায় সব ঠিক পাওয়া গেছে — এই Issue বন্ধ করা হলো।',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
