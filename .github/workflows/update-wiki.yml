name: Update wiki index

# main-এ push হলে generated output (topics-index.json, per-topic HTML, sitemap,
# sw.js, version.json ইত্যাদি) নতুন করে বানিয়ে সরাসরি main-এ commit করে।
# Cloudflare Pages main-এর প্রতিটা push deploy করে, তাই এই commit-ই লাইভ সাইটে
# নতুন তথ্য পৌঁছে দেয়। (২০২৬-০৯-২০ থেকে। আগে এটা auto/rebuild-output নামে
# একটা PR খুলত — কেন সেটা বাদ গেল তা নিচের শেষ ধাপের মন্তব্যে আছে।)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build index
        run: python3 scripts/build_index.py

      - name: Verify site consistency
        run: python3 scripts/verify_site.py

      - name: পরিবর্তন আছে কিনা যাচাই
        id: changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/topics-index.json docs/mcq-index.json docs/sw.js docs/version.json docs/ghotonaprobaho-index.json docs/top-news-index.json docs/topic/ docs/sitemap.xml docs/robots.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # সত্যিকারের কনটেন্ট পরিবর্তন হলেই (changed==true) কেবল ভার্সন বাড়ানো হয় —
      # নাহলে প্রতিটা push-এই ভার্সন বাড়ত। যেহেতু "Build index" ধাপ আগেই পুরোনো
      # VERSION দিয়ে চলেছে, এই diff-check নিজেই ভার্সন-নিরপেক্ষভাবে প্রকৃত
      # পরিবর্তন ধরে। bot-এর নিজের commit-ও main-এ যায়; GITHUB_TOKEN-এর push নতুন
      # workflow ট্রিগার করে না তাই লুপ হয় না, আর কেউ পরে PAT-এ বদলালেও এই
      # diff-check (পরের রানে changed=false) লুপ ঠেকাবে।
      - name: ভার্সন বাড়ানো (শুধু প্রকৃত কনটেন্ট পরিবর্তন থাকলে)
        if: steps.changes.outputs.changed == 'true'
        id: bump
        run: |
          CURRENT=$(cat VERSION)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "$NEW_VERSION" > VERSION
          echo "ভার্সন বাড়ানো হলো: $CURRENT → $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: নতুন ভার্সন দিয়ে আবার বিল্ড (sw.js/version.json স্ট্যাম্প করতে)
        if: steps.changes.outputs.changed == 'true'
        run: python3 scripts/build_index.py

      - name: বাম্প হওয়া ফাইল আবার stage করা
        if: steps.changes.outputs.changed == 'true'
        run: git add VERSION docs/topics-index.json docs/mcq-index.json docs/sw.js docs/version.json docs/ghotonaprobaho-index.json docs/top-news-index.json docs/topic/ docs/sitemap.xml docs/robots.txt

      # generated output সরাসরি main-এ commit + push — PR ছাড়া।
      #
      # কেন PR নয়: আগের নকশায় bot auto/rebuild-output branch-এ PR খুলত, যা
      # কাউকে হাতে merge করতে হতো। ২০২৬-০৮-১৪ থেকে ০৯-১৯-এর মধ্যে ৯টা এমন
      # PR-এ ৬৭টা force-push হয়েছে, আর প্রতিটা push-ই হয়েছে github-actions[bot]
      # নামে (PAT দিয়ে একবারও নয়)। ফলে pr-check "action_required"-এ আটকে যেত,
      # PR অমার্জিত পড়ে থাকত, আর লাইভ সাইট সপ্তাহের পর সপ্তাহ stale থাকত
      # (PR #64: ৬ দিন; PR #137: ৩০ আগস্ট থেকে ১৯ সেপ্টেম্বর)।
      #
      # রুট-কজ (ভুলবেন না): actions/checkout ডিফল্টে (persist-credentials: true)
      # GITHUB_TOKEN-কে git-এর http.extraheader-এ বসিয়ে রাখে, আর সেটা push-URL-এ
      # বসানো PAT-এর চেয়ে অগ্রাধিকার পায়। তাই `git push https://x-access-token:
      # <PAT>@...` লিখলেও push আসলে GITHUB_TOKEN দিয়েই যেত — PAT শুধু API-কলে
      # (PR খোলা/খোঁজা) কাজ করত। secret-এর নাম বদলালে (BOT_PAT → WORKFLOW_PAT)
      # এটা ঠিক হয় না। PAT দিয়ে push করতে হলে checkout-এ
      # `persist-credentials: false` বাধ্যতামূলক — scripts/verify_integration_bugs.py
      # এটা পাহারা দেয়।
      #
      # এখন: GITHUB_TOKEN (permissions: contents: write) দিয়ে সরাসরি main-এ push।
      # এটা কাজ করে শুধু তখনই যখন main-এ branch protection/ruleset নেই। পরে
      # protection চালু করলে এই ধাপ নিচের স্পষ্ট এরর দিয়ে fail করবে — তখন
      # github-actions-কে bypass দিতে হবে।
      #
      # সমান্তরাল merge: এই run চলার সময় main এগিয়ে গেলে এর output নতুন কনটেন্ট
      # ধরে না, তাই push না করে থামা নিরাপদ — ওই নতুন commit-এর নিজস্ব run সব
      # (এই কনটেন্টসহ) নতুন করে বানিয়ে push করবে।
      #
      # ⚠️ commit message-এ "[skip ci]" (বা অন্য skip-ci ট্যাগ) যোগ করবেন না — এতে
      # Actions এবং সম্ভবত Cloudflare Pages-এর deploy-ও বাদ পড়তে পারে, ফলে সাইট
      # stale থাকবে। লুপ ঠেকাতে এটা দরকারও নেই (উপরের diff-check আছে)।
      - name: generated output সরাসরি main-এ commit + push
        if: steps.changes.outputs.changed == 'true'
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          BASE_SHA="$GITHUB_SHA"
          git commit -m "chore: rebuild generated site output + bump version to $NEW_VERSION"

          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::notice::এই run শুরুর পর main এগিয়ে গেছে — push বাদ; নতুন commit-এর run generated output বানাবে।"
            exit 0
          fi

          if git push origin HEAD:main; then
            echo "✓ generated output main-এ push হয়েছে (ভার্সন $NEW_VERSION) — Cloudflare Pages deploy শুরু হবে।"
            exit 0
          fi

          # push ব্যর্থ: শেষ মুহূর্তে main এগিয়েছে (রেস), নাকি অন্য কারণ?
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::notice::push-এর মুহূর্তে main এগিয়ে গেছে — নতুন commit-এর run এটা সামলাবে।"
            exit 0
          fi
          echo "::error::main-এ push ব্যর্থ, অথচ main এগোয়নি — সম্ভবত main-এ branch protection/ruleset চালু হয়েছে। সমাধান: Settings → Rules-এ github-actions-কে bypass দিন (অথবা PAT দিয়ে push করুন — তখন checkout-এ persist-credentials: false লাগবে)।"
          exit 1
