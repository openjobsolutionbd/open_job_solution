name: Validate Question Data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate question data
        run: node _dev/validate_data.js

      - name: Check governance-doc consistency
        run: node _dev/check_docs_consistency.js

      - name: Install dev dependencies
        run: npm install --prefix _dev

      - name: JS regression tests (bcs-mcq, primary-mcq, written-exam)
        run: npm run test:js --prefix _dev

      - name: Bangla spell-check (advisory)
        run: npm run spellcheck --prefix _dev
        continue-on-error: true
