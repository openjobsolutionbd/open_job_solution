<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বই সমূহ — Open Job Solution</title>
  <meta name="theme-color" content="#1a1814">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="বই সমূহ">
  <link href="/_assets/fonts/noto-bengali.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script>
    (function() {
      const t = localStorage.getItem('bcs_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>

  <div class="page-wrap">

    <header class="top">
      <a class="back-btn" href="/" title="হোমে ফিরুন">←</a>
      <h1>📖 বই সমূহ</h1>
      <button class="theme-btn" id="themeBtn" title="Dark/Light">🌙</button>
    </header>

    <div id="bookSections"></div>

    <footer>Open Job Solution · বই সমূহ</footer>

  </div>

  <script src="data/manifest.js"></script>
  <script>
    const wrap = document.getElementById('bookSections');

    Object.values(BOOKS).forEach(book => {
      const section = document.createElement('div');
      section.className = 'book-section';

      const grid = book.subjects.map(s => `
        <a class="subject-card" href="book.html?b=${encodeURIComponent(book.id)}&s=${encodeURIComponent(s.id)}">
          <div class="subject-icon">${BOOK_ICONS[s.id] || ''}</div>
          <div class="subject-label">${s.label}</div>
          ${s.marks ? `<div class="subject-marks">${s.marks} নম্বর</div>` : ''}
        </a>
      `).join('');

      section.innerHTML = `
        <div class="book-section-title">📘 ${book.title}</div>
        <div class="book-section-desc">${book.desc}</div>
        <div class="subject-grid">${grid}</div>
      `;
      wrap.appendChild(section);
    });

    // থিম টগল (root index.html-এর সাথে একই localStorage key ব্যবহার
    // করা হয়েছে, তাই টগল করলে সারা অ্যাপ জুড়ে সামঞ্জস্যপূর্ণ থাকবে)
    const btn = document.getElementById('themeBtn');
    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      btn.textContent = t === 'dark' ? '☀️' : '🌙';
    }
    applyTheme(localStorage.getItem('bcs_theme') || 'light');
    btn.addEventListener('click', () => {
      const n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('bcs_theme', n);
      applyTheme(n);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/books/sw.js').catch(err => {
          console.warn('[SW] Registration failed:', err);
        });
      });
    }
    navigator.serviceWorker && navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!window.__swReloaded) {
        window.__swReloaded = true;
        window.location.reload();
      }
    });
  </script>
</body>
</html>
