name: Sync to open_job_solution (current-affairs section)

# এই workflow টা প্রতি push-এ চলে না — বরং প্রতি ৩ দিন পরপর একবার চলে,
# আর সেই মুহূর্তে open_current_affairs-এ যা কিছু জমা হয়েছে (এক বা একাধিক push মিলিয়ে)
# সবটা একসাথে open_job_solution-এর current-affairs সেকশনে পাঠিয়ে দেয়।
# এতে মূল রিপোতে (open_current_affairs) যত ইচ্ছা ঘন ঘন কাজ করা যায়,
# কোনো প্রভাব ছাড়াই — সিঙ্ক শুধু নির্ধারিত সময়েই ঘটে।
on:
  schedule:
    # প্রতি ৩ দিন পরপর, UTC সময় রাত ০০:০০ (বাংলাদেশ সময় ভোর ৬টা) —
    # এই সময়টা বেছে নেওয়া হয়েছে যাতে ইউজারদের ব্যস্ত সময়ে সাইট রিফ্রেশ না হয়
    - cron: "0 0 */3 * *"
  # চাইলে GitHub-এর "Run workflow" বাটন দিয়ে যেকোনো সময় ম্যানুয়ালিও চালানো যাবে
  workflow_dispatch: {}

# বাগ-ফিক্স (concurrency): দুইটা রান একসাথে চললে দুটোই একই সময়ে
# open_job_solution-এ push করার চেষ্টা করত, আর দ্বিতীয়টা ব্যর্থ (❌) হয়ে
# যেত (কোনো তথ্য নষ্ট হতো না, কিন্তু বিভ্রান্তিকর লাল রান দেখাত)। এখন
# একই group-এর নতুন রান শুরু হওয়া মাত্র আগেরটা যদি এখনো চলমান থাকে,
# GitHub সেটাকে সারিতে (queue) রাখবে — একসাথে চলতে দেবে না।
concurrency:
  group: sync-to-job-solution
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout open_current_affairs (source)
        uses: actions/checkout@v4
        with:
          path: source
          ref: main

      - name: Checkout open_job_solution (destination)
        uses: actions/checkout@v4
        with:
          repository: openjobsolutionbd/open_job_solution
          path: destination
          # নিরাপত্তা-স্তর ৪: এই টোকেন শুধুমাত্র open_job_solution রিপোতে
          # লেখার অনুমতির জন্য বানানো, নির্দিষ্ট মেয়াদসহ, এবং GitHub Secrets-এ
          # সংরক্ষিত — কোথাও প্লেইন টেক্সটে দেখা যায় না।
          token: ${{ secrets.JOB_SOLUTION_SYNC_TOKEN }}

      - name: current-affairs/docs ফোল্ডার হালনাগাদ করা (শুধু ওয়েবসাইট কনটেন্ট, বাকি রিপো নয়)
        # বাগ-ফিক্স (স্কোপ): আগে পুরো open_current_affairs রিপো — README,
        # AGENTS.md, ডেভেলপমেন্ট স্ক্রিপ্ট, ভেতরের নোট, package.json ইত্যাদি
        # সহ (~৩৭০ KB অপ্রয়োজনীয় ফাইল) — কপি হতো। এখন শুধু docs/ ফোল্ডার,
        # যেটা আসলে ওয়েবসাইট হিসেবে দেখানো হয়, কপি হবে।
        run: |
          set -e
          echo "পুরনো current-affairs/ ফোল্ডার সরানো হচ্ছে (destination-এর ভেতরে শুধু এইটুকু)..."
          rm -rf destination/current-affairs
          mkdir -p destination/current-affairs/docs

          echo "নতুন কনটেন্ট কপি করা হচ্ছে (শুধু docs/)..."
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            source/docs/ destination/current-affairs/docs/

      - name: পুরনো ঠিকানার লিংক ঠিক করা (canonical / redirect / sitemap)
        # বাগ-ফিক্স (সবচেয়ে গুরুত্বপূর্ণ): টপিক পেজ, sitemap.xml, canonical
        # ট্যাগে আগে থেকেই standalone সাইটের (open-current-affairs.pages.dev)
        # পূর্ণ ঠিকানা বসানো ছিল। এখানে কপি হওয়ার পর সেটা ভুল হয়ে যায় —
        # দর্শক টপিক-লিংকে ঢুকলে open_job_solution থেকে বাইরে ছিটকে যেত,
        # আর গুগলও ভুল "আসল ঠিকানা" (canonical) শিখত। এই ধাপে docs/-এর
        # ভেতরের সব ফাইলে সেই পুরনো ঠিকানাকে নতুন, সঠিক পাথ দিয়ে বদলে
        # দেওয়া হচ্ছে, আর শেষে যাচাই করা হচ্ছে যে কিছু বাদ পড়েনি।
        run: |
          set -e
          OLD="https://open-current-affairs.pages.dev"
          NEW="/current-affairs/docs"
          COUNT=$(grep -rl "$OLD" destination/current-affairs/docs/ 2>/dev/null | wc -l)
          echo "পুরনো ঠিকানা পাওয়া গেছে $COUNT টা ফাইলে, ঠিক করা হচ্ছে..."
          grep -rlZ "$OLD" destination/current-affairs/docs/ 2>/dev/null \
            | xargs -0 -r sed -i "s|$OLD|$NEW|g"
          REMAINING=$(grep -rl "$OLD" destination/current-affairs/docs/ 2>/dev/null | wc -l)
          if [ "$REMAINING" -ne 0 ]; then
            echo "সতর্কবার্তা: এখনো $REMAINING টা ফাইলে পুরনো ঠিকানা রয়ে গেছে, ম্যানুয়ালি চেক করা দরকার" >&2
            exit 1
          fi
          echo "✅ সব ঠিকানা ঠিক করা হয়েছে ($COUNT টা ফাইলে)।"

          # প্রিন্ট/PDF watermark-এ লিংকের href তো ঠিক হয়ে গেল, কিন্তু
          # দৃশ্যমান টেক্সটে (protocol ছাড়া বেয়ার ডোমেইন নাম) এখনো পুরনো
          # নাম থেকে যায় — সেটাও এখানে ঠিক করা হচ্ছে।
          BARE_OLD="open-current-affairs.pages.dev"
          BARE_NEW="Open Job Solution"
          grep -rlZ "class=\"print-watermark\">$BARE_OLD<" destination/current-affairs/docs/ 2>/dev/null \
            | xargs -0 -r sed -i "s|class=\"print-watermark\">$BARE_OLD<|class=\"print-watermark\">$BARE_NEW<|g"
          # বাগ-ফিক্স (যাচাই যোগ করা): আগে এই ধাপে কোনো যাচাই ছিল না — উপরের
          # sed প্যাটার্নটা ভবিষ্যতে HTML গঠন সামান্য বদলালে (যেমন attribute-এর
          # ক্রম বদলালে) নিঃশব্দে কিছুই না বদলিয়ে তবু "✅ সফল" দেখাত। এখন
          # রিপ্লেসমেন্টের পরেও পুরনো প্যাটার্ন থেকে গেলে স্পষ্টভাবে ব্যর্থ (❌) দেখাবে,
          # href-fix ধাপের মতোই।
          REMAINING_WATERMARK=$(grep -rl "class=\"print-watermark\">$BARE_OLD<" destination/current-affairs/docs/ 2>/dev/null | wc -l)
          if [ "$REMAINING_WATERMARK" -ne 0 ]; then
            echo "সতর্কবার্তা: watermark-এর টেক্সট এখনো $REMAINING_WATERMARK টা ফাইলে বদলানো যায়নি (HTML গঠন বদলে থাকতে পারে), ম্যানুয়ালি চেক করা দরকার" >&2
            exit 1
          fi
          echo "✅ watermark টেক্সট ঠিক করা হয়েছে।"

      - name: অ্যাপ-পরিচয় সংঘর্ষ এড়ানো (manifest link বাদ দেওয়া)
        # current-affairs নিজেকে আলাদা ইনস্টলযোগ্য অ্যাপ হিসেবে ঘোষণা করবে
        # না, যাতে open_job_solution-এর "একটাই PWA পরিচয়" নিয়ম বজায় থাকে।
        run: |
          set -e
          INDEX="destination/current-affairs/docs/index.html"
          if [ -f "$INDEX" ]; then
            sed -i '/<link rel="manifest"/d' "$INDEX"
            echo "manifest link বাদ দেওয়া হয়েছে: $INDEX"
          else
            echo "সতর্কবার্তা: docs/index.html পাওয়া যায়নি, ম্যানুয়ালি চেক করা দরকার" >&2
            exit 1
          fi

      - name: হোমে ফেরার লিংক যোগ করা (না থাকলে সন্নিবেশ)
        # `^<body>$` (পুরো লাইনে শুধু <body>) দিয়ে anchor করা, আর `0,/../`
        # দিয়ে শুধু প্রথম মিল বদলানো হয় — যাতে ফাইলের অন্য কোথাও ভুল করে
        # না বসে যায়।
        run: |
          set -e
          INDEX="destination/current-affairs/docs/index.html"
          if grep -q "হোমে ফিরুন" "$INDEX"; then
            echo "হোমে ফেরার লিংক আগে থেকেই আছে, কিছু করার দরকার নেই।"
          else
            sed -i '0,/^<body>$/{s|^<body>$|<body>\n<a href="/" style="display:inline-block;margin:10px 16px 0;font-size:14px;text-decoration:none;color:inherit;opacity:0.75;">⬅️ হোমে ফিরুন</a>|}' "$INDEX"
            if grep -q "হোমে ফিরুন" "$INDEX"; then
              echo "হোমে ফেরার লিংক সফলভাবে যোগ করা হয়েছে।"
            else
              echo "সতর্কবার্তা: <body> ট্যাগ (একা একটা লাইনে) পাওয়া যায়নি, ম্যানুয়ালি চেক করা দরকার" >&2
              exit 1
            fi
          fi

      - name: অপ্রয়োজনীয়/লগ ফাইল বাদ দেওয়া
        run: |
          find destination/current-affairs -iname "*.log" -delete 2>/dev/null || true
          find destination/current-affairs -path "*_system*" -exec rm -rf {} + 2>/dev/null || true

      - name: পরিবর্তন git-এ যোগ করা (verify আর commit-এর আগে, যাতে verify আসল staged অবস্থা দেখে)
        working-directory: destination
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add current-affairs/

      - name: নিরাপত্তা-স্তর ১ — সিঙ্কের যাচাই (git-এ আসলে কী জমা হলো তা মিলিয়ে দেখা)
        # বাগ-ফিক্স: আগে শুধু ডিস্কে কতগুলো ফাইল কপি হয়েছে তা গোনা হতো —
        # git-এ আসলে জমা (staged) হয়েছে কিনা তা না। destination রিপোর কোনো
        # .gitignore নিয়মের কারণে ভবিষ্যতে যদি কোনো ফাইল চুপচাপ বাদ পড়ে
        # যায়, আগের চেক সেটা ধরতেই পারত না (ডিস্কে ফাইল থাকলেও গোনা হতো)।
        # এখন git ls-files দিয়ে সত্যিই কমিটযোগ্য ফাইল-সংখ্যা গোনা হচ্ছে।
        run: |
          set -e
          SRC_COUNT=$(find source/docs -type f | wc -l)
          DEST_COUNT=$(git -C destination ls-files current-affairs/docs | wc -l)
          echo "উৎস ফাইল-সংখ্যা (docs/): $SRC_COUNT"
          echo "গন্তব্যে git-এ জমা হওয়া ফাইল-সংখ্যা (docs/): $DEST_COUNT"
          if [ "$SRC_COUNT" -ne "$DEST_COUNT" ]; then
            echo "sync_ok=false" >> "$GITHUB_OUTPUT"
            echo "❌ ফাইল-সংখ্যা মিলছে না! সিঙ্ক অসম্পূর্ণ হতে পারে (হয়তো কোনো ফাইল git-এ যোগই হয়নি)।" >&2
            exit 1
          fi
          echo "sync_ok=true" >> "$GITHUB_OUTPUT"
          echo "✅ যাচাই সফল — ফাইল-সংখ্যা মিলেছে (git-এ জমা হওয়া অনুযায়ী)।"

      - name: পরিবর্তন branch+PR দিয়ে merge করা (main protected, সরাসরি push অসম্ভব)
        # বাগ-ফিক্স (২০২৬-০৮-২১): open_job_solution-এর main branch এখন
        # protected (required status check "validate") — required-status-check
        # থাকা branch-এ সরাসরি push করার কোনো পথ নেই (কোনো PR-ই তৈরি হয় না
        # যার সাথে check attach হবে)। আগে এখানে সরাসরি `git push origin main`
        # করা হতো, যা protection চালুর সাথে সাথেই ব্যর্থ হতে শুরু করে
        # ("Required status check \"validate\" is expected")। এখন থেকে
        # বাকি রিপোর মতোই branch → PR → check পাস → merge — কোনো বাইপাস-হোল
        # ছাড়াই, উল্টো "validate" check সিঙ্ক-করা কনটেন্টও যাচাই করে দেবে
        # (কোনো bcs-mcq/data/*.js ফাইল স্পর্শ না হওয়ায় এই check সবসময় পাস
        # করবে — শুধু current-affairs/docs/ বদলায়)।
        working-directory: destination
        env:
          GH_TOKEN: ${{ secrets.JOB_SOLUTION_SYNC_TOKEN }}
        run: |
          set -e
          if git diff --cached --quiet; then
            echo "কোনো পরিবর্তন নেই, PR/merge করার দরকার নেই।"
            exit 0
          fi

          BRANCH="bot/sync-current-affairs"
          git commit -m "chore: sync current-affairs content from open_current_affairs [skip ci]"

          # স্থায়ী bot-branch পুনর্ব্যবহার করা হয় (force-push) — এটা মানুষের
          # কাজের branch না, তাই প্রতিবার নতুন কনটেন্ট দিয়ে replace করাই ঠিক।
          # merge হওয়ার পর repo-র delete_branch_on_merge সেটিং এটা মুছে দেয়,
          # তাই সাধারণত পরের রানে branch নতুন করেই তৈরি হয়।
          git push origin "HEAD:refs/heads/${BRANCH}" --force

          API="https://api.github.com/repos/openjobsolutionbd/open_job_solution"

          # একই branch-এ আগে থেকে খোলা PR থাকলে (আগের রান merge/check-এ আটকে
          # থাকলে) সেটাই পুনর্ব্যবহার করা হয় — নাহলে GitHub নতুন PR খুলতে
          # দেবে না ("A pull request already exists") আর নতুন কনটেন্ট এমনিতেই
          # ওই PR-এ যোগ হয়ে গেছে উপরের force-push-এ।
          EXISTING_PR=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/pulls?head=openjobsolutionbd:${BRANCH}&state=open" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['number'] if d else '')")

          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER="$EXISTING_PR"
            echo "বিদ্যমান PR পুনর্ব্যবহার করা হচ্ছে: #$PR_NUMBER"
          else
            PR_NUMBER=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/pulls" \
              -d "{\"title\":\"chore: sync current-affairs content ($(date -u +%Y-%m-%d))\",\"head\":\"${BRANCH}\",\"base\":\"main\",\"body\":\"open_current_affairs থেকে স্বয়ংক্রিয় সিঙ্ক (sync-to-job-solution.yml)।\"}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['number'])")
            echo "নতুন PR খোলা হলো: #$PR_NUMBER"
          fi

          # check সম্পূর্ণ ও mergeable_state 'clean' হওয়ার অপেক্ষা (সর্বোচ্চ ~৫ মিনিট)
          MERGEABLE_STATE=""
          for i in $(seq 1 20); do
            sleep 15
            MERGEABLE_STATE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/pulls/$PR_NUMBER" | python3 -c "import json,sys; print(json.load(sys.stdin).get('mergeable_state'))")
            echo "চেষ্টা $i — mergeable_state: $MERGEABLE_STATE"
            if [ "$MERGEABLE_STATE" = "clean" ]; then
              break
            fi
            if [ "$MERGEABLE_STATE" = "behind" ]; then
              curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$API/pulls/$PR_NUMBER/update-branch" > /dev/null
            fi
          done

          if [ "$MERGEABLE_STATE" != "clean" ]; then
            echo "::error::PR #$PR_NUMBER ৫ মিনিটেও merge-উপযোগী (clean) হয়নি — শেষ অবস্থা: $MERGEABLE_STATE। PR-টা খোলা রাখা হলো, ম্যানুয়ালি https://github.com/openjobsolutionbd/open_job_solution/pull/$PR_NUMBER চেক করা দরকার।"
            exit 1
          fi

          MERGE_RESULT=$(curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/pulls/$PR_NUMBER/merge" -d '{"merge_method":"squash"}')
          echo "$MERGE_RESULT"
          MERGED=$(echo "$MERGE_RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('merged', False))")
          if [ "$MERGED" != "True" ]; then
            echo "::error::PR #$PR_NUMBER merge ব্যর্থ হয়েছে — ম্যানুয়ালি চেক করা দরকার: https://github.com/openjobsolutionbd/open_job_solution/pull/$PR_NUMBER"
            exit 1
          fi
          echo "✅ PR #$PR_NUMBER সফলভাবে merge হয়েছে।"

      # নিরাপত্তা-স্তর ২: সিঙ্ক ব্যর্থ হলে স্পষ্ট বার্তা তৈরি হবে (উপরের কোনো ধাপ
      # ব্যর্থ হলে GitHub স্বয়ংক্রিয়ভাবে এই ধাপটা চালাবে)
      - name: ব্যর্থতার স্পষ্ট বার্তা (কোনো আগের ধাপ ব্যর্থ হলে)
        if: failure()
        run: |
          echo "::error::current-affairs সিঙ্ক ব্যর্থ হয়েছে — open_job_solution-এর কারেন্ট অ্যাফেয়ার্স সেকশনে নতুন তথ্য এখনো পৌঁছায়নি। পুরনো কনটেন্ট অক্ষত আছে (নিরাপত্তা-স্তর ৩), কিন্তু নতুন আপডেট ম্যানুয়ালি চেক করা দরকার।"
