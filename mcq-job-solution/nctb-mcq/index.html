<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCTB MCQ · Open Job Solution</title>
  <meta name="theme-color" content="#f5f1eb">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/_assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/_assets/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Open Job Solution">
  <link href="/_assets/fonts/noto-bengali.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f1eb;
      --surface: #ffffff;
      --border: #e0d8cc;
      --text-primary: #1a1814;
      --text-secondary: #6b6358;
      --accent-bcs: #2563eb;
      --accent-primary: #16a34a;
      --accent-written: #9333ea;
      --accent-ca: #0e7c66;
      --accent-books: #d97706;
      --shadow: 0 2px 16px rgba(0,0,0,0.08);
      --shadow-hover: 0 8px 32px rgba(0,0,0,0.14);
      --radius: 16px;
    }
    /* ══════════════════════════════════════════════════════════
       ── COMMON (মোবাইল ও ডেস্কটপ উভয়ের বেস স্টাইল) ──
       এই অংশের নিয়ম দুই ভিউতেই প্রযোজ্য।
       ══════════════════════════════════════════════════════════ */

    body {
      font-family: 'Noto Serif Bengali', serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      transition: background 0.3s, color 0.3s;
    }

    .page-wrap {
      width: 100%;
      max-width: 420px;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }
    .app-logo { font-size: 2.8rem; margin-bottom: 8px; }
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      text-decoration: none;
      color: var(--text-primary);
      box-shadow: var(--shadow);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }
    .card:active { transform: translateY(0px); }

    .card.bcs:hover  { border-color: var(--accent-bcs); }
    .card.prim:hover { border-color: var(--accent-primary); }
    .card.writ:hover { border-color: var(--accent-written); }
    .card.ca:hover   { border-color: var(--accent-ca); }
    .card.books:hover { border-color: var(--accent-books); }

    .card-icon {
      font-size: 2.2rem;
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
    }
    .bcs  .card-icon { background: #eff6ff; }
    .prim .card-icon { background: #f0fdf4; }
    .writ .card-icon { background: #faf5ff; }
    .ca   .card-icon { background: #ecfeff; }
    .books .card-icon { background: #fffbeb; }

    .card-text { flex: 1; }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .arrow {
      color: var(--text-secondary);
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    footer {
      margin-top: 36px;
      color: var(--text-secondary);
      font-size: 0.8rem;
      text-align: center;
    }

    /* ══════════════════════════════════════════════════════════
       ── MOBILE ONLY (স্ক্রিন প্রস্থ ৭৬৮px পর্যন্ত) ──
       ভবিষ্যতে মোবাইলের জন্য যেকোনো আলাদা পরিবর্তন এই ব্লকে যোগ হবে।
       এই ব্লক ডেস্কটপকে প্রভাবিত করবে না।
       ══════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      /* বর্তমানে মোবাইলের জন্য বাড়তি কোনো ওভাররাইড প্রয়োজন নেই —
         উপরের COMMON স্টাইলই মোবাইলে প্রযোজ্য থাকবে। */
    }

    /* ══════════════════════════════════════════════════════════
       ── DESKTOP ONLY (স্ক্রিন প্রস্থ ৭৬৯px এবং তার বেশি) ──
       ভবিষ্যতে ডেস্কটপের জন্য যত পরিবর্তন আনতে চান, সব এই ব্লকে
       যোগ করা হবে। এই ব্লক মোবাইলকে প্রভাবিত করবে না।
       ══════════════════════════════════════════════════════════ */
    @media (min-width: 769px) {
      /* বর্তমানে ডেস্কটপের জন্য বাড়তি কোনো ওভাররাইড প্রয়োজন নেই।
         ভবিষ্যতের ডেস্কটপ-নির্দিষ্ট পরিবর্তন এখানে যোগ হবে। */
    }
      .back-home { display:block; text-align:center; margin:18px 0 4px; color:var(--text-secondary); text-decoration:none; font-size:0.9rem; }
    .scroll-top-btn{position:fixed;bottom:24px;right:20px;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);box-shadow:var(--shadow);cursor:pointer;color:#2563eb;font-size:1.1rem;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:translateY(8px);transition:all 0.2s ease;z-index:99}
    .scroll-top-btn.visible{opacity:1;visibility:visible;transform:translateY(0)}
    .scroll-top-btn:hover{box-shadow:var(--shadow-hover)}
  </style>
</head>
<body>

  <div class="page-wrap">

    <header>
      <div class="app-logo">📘</div>
      <h1>NCTB MCQ</h1>
      <p class="subtitle">NCTB পাঠ্যবইভিত্তিক MCQ</p>
    </header>

    <div class="cards">
      <div class="card bcs" style="cursor:default">
        <div class="card-icon">🚧</div>
        <div class="card-text">
          <div class="card-title">শীঘ্রই আসছে</div>
          <div class="card-desc">এই সেকশনে NCTB পাঠ্যবইভিত্তিক MCQ যোগ করা হবে।</div>
        </div>
      </div>
    </div>

    <a class="back-home" href="/mcq-job-solution/">⬅️ MCQ Job Solution</a>

    <footer>NCTB MCQ · v1.369</footer>

  </div>

  <button class="scroll-top-btn" id="scrollTopBtn">↑</button>

  <script>
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('visible', window.scrollY > 300);
    });
    scrollTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/mcq-job-solution/sw.js').catch(err => {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
  <!-- নোট: আগে এখানে controllerchange-এ window.location.reload() করা হতো,
       যা নতুন SW activate হওয়ার কিছুক্ষণ পর পেজকে হঠাৎ রিলোড করে ফেলত
       (ব্যবহারকারীর কাছে একটা অপ্রত্যাশিত "ঝাঁকি" হিসেবে অনুভূত হতো)।
       এখন নতুন SW নিঃশব্দে claim করে নেয়, পরবর্তী ফেচ/নেভিগেশন থেকে
       স্বয়ংক্রিয়ভাবে কার্যকর হয় — চলমান পেজ জোর করে রিলোড হয় না। -->
</body>
</html>
